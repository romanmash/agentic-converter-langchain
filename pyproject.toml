[project]
name = "agentic-converter-lc"
version = "1.0.1"
description = "LangChain-based Jenkinsfile to GitHub Actions converter"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
